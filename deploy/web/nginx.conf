# nginx config for the `web` container (apps/web static bundle).
#
# This nginx serves ONLY the pre-built SPA. It never proxies to the API or the
# broker — Caddy does that at the edge. Keeping the two concerns separate means
# this container has no route to any backend and nothing to misconfigure into a
# data channel.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Don't leak the nginx version.
    server_tokens off;

    # Long-cache fingerprinted build assets (Vite emits hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths render index.html so client-side
    # routing works on hard refresh / deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell — it references the current asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
