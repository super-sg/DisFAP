; =============================================================================
; xrdp-lockdown.ini — DisFAP RDP host channel lockdown (isolation layer 3)
;
; This is the SOURCE OF TRUTH for which RDP virtual channels the session host
; permits. install-workspace.sh merges it into /etc/xrdp/xrdp.ini:
;
;   * It forces `allow_channels=false` in [Globals]  — the master kill switch:
;     with this set, xrdp negotiates NO virtual channels at all, regardless of
;     anything a client asks for. Everything below is belt-and-braces on top.
;
;   * It replaces the [Channels] section of xrdp.ini with the one defined here,
;     so each channel is *also* individually disabled and the intent is
;     auditable in one place.
;
; Why at the host and not only at guacd?  docs/security.md layer 3: this
; survives a compromised broker that tries to turn channels back on. guacd's
; disable-copy / enable-drive=false (layer 1) and the broker instruction filter
; (layer 2) sit in front of this; the host refusing the channels is the backstop
; that does not trust anything upstream of it.
;
; Channel reference (RDP virtual channels xrdp knows about):
;   cliprdr  — clipboard (copy/paste)                 -> DENY
;   rdpdr    — device redirection: DRIVES, PRINTERS,   -> DENY
;              SMARTCARDS, SERIAL (COM), PARALLEL (LPT)
;   rdpsnd   — audio OUTPUT (host -> client speakers)  -> DENY (no data path)
;   audin    — audio INPUT  (client mic -> host)       -> DENY (mic is a channel)
;   drdynvc  — dynamic virtual channels (carries audin,-> DENY (kills the
;              video redir, and other add-ins)               transport itself)
;   rail     — RemoteApp / seamless windows            -> DENY
;   xrdpvr   — video redirection                       -> DENY
;
; Disabling drdynvc removes the transport that audin/video redirection ride on,
; so mic and multimedia redirection are impossible even if a future xrdp adds
; new dynamic add-ins. Pixels out + keyboard/mouse in is all that remains.
; =============================================================================

[Channels]
rdpdr=false
rdpsnd=false
drdynvc=false
cliprdr=false
rail=false
xrdpvr=false

; -----------------------------------------------------------------------------
; The settings below are applied by install-workspace.sh to [Globals] and to
; the sesman config; they are recorded here for audit but are NOT parsed as an
; ini [Channels] block. Do not move them under [Channels].
; -----------------------------------------------------------------------------
;
; /etc/xrdp/xrdp.ini  [Globals]
;   allow_channels=false        ; master kill switch — no virtual channels
;   channel_code=1              ; (legacy) leave default; allow_channels wins
;   security_layer=tls          ; force TLS; no plain RDP
;   crypt_level=high            ; strongest legacy crypt as a floor
;   tls_ciphers=HIGH
;   bitmap_compression=true     ; pixels only; compression is fine
;   new_cursors=true
;
; /etc/xrdp/sesman.ini
;   [Security]
;   AllowRootLogin=false        ; the 'session' user only, never root
;   MaxLoginRetry=3
;   TerminalServerUsers=tsusers ; only members may log in (see install script)
;   AlwaysGroupCheck=true
;   RestrictOutboundClipboard=all  ; redundant with cliprdr=false, kept explicit
;   RestrictInboundClipboard=all
;   [Sessions]
;   KillDisconnected=true       ; a dropped RDP link ends the desktop session —
;   DisconnectedTimeLimit=0     ; supports burn-after-reading ephemerality
;   IdleTimeLimit=0             ; idle policy is enforced by the control plane
