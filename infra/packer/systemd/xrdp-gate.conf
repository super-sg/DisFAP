# =============================================================================
# xrdp-gate.conf — FAIL-CLOSED gate on the RDP login listener (M8).
#
# Installed as a drop-in for BOTH xrdp.service and xrdp-sesman.service:
#   /etc/systemd/system/xrdp.service.d/dfap-gate.conf
#   /etc/systemd/system/xrdp-sesman.service.d/dfap-gate.conf
#
# `Requires=dfap-provision.service` means: if provisioning failed (failed
# account creation, unverifiable instance identity, unreachable control plane),
# xrdp and xrdp-sesman are NOT started. The remote-login service therefore never
# exposes a usable session before credential provisioning and validation succeed
# — the spec's "no bootstrap window" property, made fail-closed.
# =============================================================================
[Unit]
Requires=dfap-provision.service
After=dfap-provision.service network-online.target
